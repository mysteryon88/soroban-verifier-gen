[package]
name = "soroban-verifier-gen"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI for generating Soroban smart contracts for Groth16 proof verification"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
resolver = "2"

[[bin]]
name = "soroban-verifier-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
soroban-verifier-gen-core = { version = "0.4.3", path = "../soroban-verifier-gen-core" }
