[package]
name = "stateful-gatekeeper"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.1"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
