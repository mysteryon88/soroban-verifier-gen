[workspace]
members = [
    "crates/soroban-verifier-gen-core",
    "crates/soroban-verifier-gen-cli",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Sergey Sobolev"]
description = "Generate Soroban smart contracts for Groth16 zero-knowledge proof verification"
